<header class="spotify-amazon-header">
  <div class="header-top">
    <!-- Logo -->
    <div class="nav-item nav-logo">
      <span class="logo-text">Store</span>
    </div>

    <!-- Deliver to -->
    <div class="nav-item nav-location">
      <span class="location-icon">📍</span>
      <div class="location-text">
        <span class="text-top">Deliver to</span>
        <span class="text-bottom">Location</span>
      </div>
    </div>

    <!-- Search Bar -->

      </div>
    </div>
  </div>

  <div class="header-bottom">
    <div class="nav-item nav-all">
      <span class="hamburger">☰</span> All
    </div>
    <div class="nav-item">Today's Deals</div>
